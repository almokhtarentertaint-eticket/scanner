<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Panitia - Al Mokhtar Ensemble</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#16161e] border border-amber-500/30 rounded-xl p-6 shadow-2xl">
        <div class="text-center border-b border-amber-500/30 pb-4 mb-6">
            <h1 class="text-amber-400 font-cinzel text-xl tracking-wider">GATE CHECK-IN</h1>
            <p class="text-slate-400 text-xs uppercase mt-1">Al Mokhtar Ensemble - 2 Okt 2026</p>
        </div>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-700 bg-black"></div>

        <!-- Status / Notifikasi Hasil Scan -->
        <div id="result-alert" class="mt-6"></div>
    </div>

    <script>
        // DAFTAR URL BACKEND GOOGLE APPS SCRIPT
        const BACKEND_URLS = [
            "https://script.google.com/macros/s/AKfycbyV2VwcJnAMXvpnW9tJQClegnEoUeLJptMVzwrBNHL_tDVByrFFvbPkr9G7HRht1t4/exec", // Backend Utama (Presale & OTS)
            "https://script.google.com/macros/s/AKfycbyrpJkydxov6jjIKlE5JnrekEkulIape2arPmeFCkJEYTHF-ydOe78c5bXIeQ5jlgyW/exec"  // Backend Cadangan / Alternatif jika ada
        ];

        let html5QrCode;

        // Fungsi Parser untuk mengambil Kode Tiket murni jika QR berisi URL
        function parseTicketCode(scannedText) {
            scannedText = scannedText.trim();
            // Jika hasil scan berupa URL (misal: https://...?ticket=AME-123456-1 atau code=AME-123456-1)
            if (scannedText.includes("code=")) {
                return scannedText.split("code=")[1].split("&")[0];
            }
            if (scannedText.includes("ticket=")) {
                return scannedText.split("ticket=")[1].split("&")[0];
            }
            return scannedText;
        }

        // Fungsi rekursif untuk mencoba fetch ke beberapa backend secara berurutan
        async function fetchWithFallback(ticketId, urlIndex = 0) {
            if (urlIndex >= BACKEND_URLS.length) {
                throw new Error("Semua backend gagal dihubungi.");
            }

            const currentUrl = BACKEND_URLS[urlIndex] + "?action=checkin&code=" + encodeURIComponent(ticketId);
            
            try {
                const response = await fetch(currentUrl);
                const data = await response.json();
                return data;
            } catch (err) {
                console.warn(`Gagal terhubung ke backend index ${urlIndex}, mencoba backend berikutnya...`, err);
                if (urlIndex + 1 < BACKEND_URLS.length) {
                    return fetchWithFallback(ticketId, urlIndex + 1);
                }
                throw err;
            }
        }

        function onScanSuccess(decodedText, decodedResult) {
            const cleanTicketCode = parseTicketCode(decodedText);

            // Hentikan sementara scanner agar tidak scan double secara instan
            html5QrCode.stop().then(() => {
                const alertBox = document.getElementById('result-alert');
                alertBox.innerHTML = `
                    <div class="bg-blue-950 border border-blue-500 text-blue-200 p-4 rounded-lg text-center font-semibold">
                        Memverifikasi ID: <span class="text-white">${cleanTicketCode}</span>...
                    </div>
                `;

                // Kirim ID Tiket menggunakan sistem Multi-Backend Fallback
                fetchWithFallback(cleanTicketCode)
                    .then(data => {
                        if (data.status === 'success') {
                            alertBox.innerHTML = `
                                <div class="bg-emerald-950 border border-emerald-500 text-emerald-200 p-4 rounded-lg text-center">
                                    <p class="font-bold text-lg text-emerald-400">✅ BERHASIL CHECK-IN!</p>
                                    <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                                    <p class="text-xs text-emerald-300 mt-2">Pemegang: <strong>${data.holder || '-'}</strong></p>
                                </div>
                            `;
                        } else if (data.status === 'already_used' || data.status === 'already_checked') {
                            alertBox.innerHTML = `
                                <div class="bg-amber-950 border border-amber-500 text-amber-200 p-4 rounded-lg text-center">
                                    <p class="font-bold text-lg text-amber-400">⚠️ TIKET SUDAH DIGUNAKAN!</p>
                                    <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                                    <p class="text-xs text-amber-300 mt-2">${data.message || 'Tiket ini sudah di-scan sebelumnya.'}</p>
                                </div>
                            `;
                        } else {
                            alertBox.innerHTML = `
                                <div class="bg-rose-950 border border-rose-500 text-rose-200 p-4 rounded-lg text-center">
                                    <p class="font-bold text-lg text-rose-400">❌ TIKET TIDAK VALID</p>
                                    <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                                    <p class="text-xs text-rose-300 mt-2">${data.message || 'Tiket tidak ditemukan di sistem.'}</p>
                                </div>
                            `;
                        }
                        
                        // Nyalakan kembali scanner setelah 3 detik
                        setTimeout(() => {
                            alertBox.innerHTML = "";
                            startScanner();
                        }, 3000);
                    })
                    .catch(err => {
                        alertBox.innerHTML = `
                            <div class="bg-rose-950 border border-rose-500 text-rose-200 p-4 rounded-lg text-center font-semibold">
                                ⚠️ Gagal terhubung ke server backend. Periksa koneksi internet.
                            </div>
                        `;
                        setTimeout(() => {
                            alertBox.innerHTML = "";
                            startScanner();
                        }, 3000);
                    });
            }).catch(err => {
                console.error("Gagal menghentikan scanner", err);
            });
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: { width: 250, height: 250 } };
            
            // Buka kamera belakang
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.warn("Kamera belakang gagal, mencoba kamera default...", err);
                html5QrCode.start(
                    { facingMode: "user" }, 
                    config, 
                    onScanSuccess
                ).catch(fallbackErr => {
                    console.error("Gagal mengakses kamera:", fallbackErr);
                    document.getElementById('result-alert').innerHTML = `
                        <div class="bg-rose-950 border border-rose-500 text-rose-200 p-3 rounded-lg text-center text-xs">
                            ⚠️ Tidak dapat mengakses kamera. Pastikan izin kamera pada browser sudah diaktifkan (Allow) dan gunakan HTTPS.
                        </div>
                    `;
                });
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            startScanner();
        });
    </script>
</body>
</html>
