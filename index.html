<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner Panitia - Al Mokhtar Ensemble</title>
    <!-- Tailwind CSS untuk styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pustaka QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0d0d11; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .font-cinzel { font-family: 'Cinzel', serif; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#16161e] border border-amber-500/30 rounded-xl p-6 shadow-2xl">
        <div class="text-center border-b border-amber-500/30 pb-4 mb-4">
            <h1 class="text-amber-400 font-cinzel text-xl tracking-wider">GATE CHECK-IN</h1>
            <p class="text-slate-400 text-xs uppercase mt-1">Al Mokhtar Ensemble - 2 Okt 2026</p>
        </div>

        <!-- Area Kamera Scanner -->
        <div id="reader" class="w-full rounded-lg overflow-hidden border border-slate-700 bg-black"></div>

        <!-- Status / Notifikasi Hasil Scan -->
        <div id="result-alert" class="mt-4 min-h-[90px]">
            <div class="bg-slate-900 border border-slate-700 text-slate-400 p-4 rounded-lg text-center text-sm">
                Arahkan kamera ke QR Code Tiket
            </div>
        </div>
    </div>

    <script>
        // DAFTAR URL BACKEND GOOGLE APPS SCRIPT
        const BACKEND_URLS = [
            "https://script.google.com/macros/s/AKfycbyV2VwcJnAMXvpnW9tJQClegnEoUeLJptMVzwrBNHL_tDVByrFFvbPkr9G7HRht1t4/exec",
            "https://script.google.com/macros/s/AKfycbyrpJkydxov6jjIKlE5JnrekEkulIape2arPmeFCkJEYTHF-ydOe78c5bXIeQ5jlgyW/exec"
        ];

        let html5QrCode;
        let isProcessing = false; // Mencegah scan berulang tanpa mematikan stream kamera

        // Parser Kode Tiket dari URL
        function parseTicketCode(scannedText) {
            scannedText = scannedText.trim();
            if (scannedText.includes("code=")) {
                return scannedText.split("code=")[1].split("&")[0];
            }
            if (scannedText.includes("ticket=")) {
                return scannedText.split("ticket=")[1].split("&")[0];
            }
            return scannedText;
        }

        // Fetch paralel dengan AbortController jika lambat
        async function fetchWithFallback(ticketId, urlIndex = 0) {
            if (urlIndex >= BACKEND_URLS.length) {
                throw new Error("Semua backend gagal dihubungi.");
            }

            const currentUrl = BACKEND_URLS[urlIndex] + "?action=checkin&code=" + encodeURIComponent(ticketId);
            
            try {
                const response = await fetch(currentUrl);
                const data = await response.json();
                return data;
            } catch (err) {
                console.warn(`Gagal terhubung ke backend ${urlIndex}, mencoba berikutnya...`, err);
                if (urlIndex + 1 < BACKEND_URLS.length) {
                    return fetchWithFallback(ticketId, urlIndex + 1);
                }
                throw err;
            }
        }

        async function onScanSuccess(decodedText) {
            // Jika masih mengunci/memproses tiket sebelumnya, abaikan pembacaan frame ini
            if (isProcessing) return;
            isProcessing = true;

            const cleanTicketCode = parseTicketCode(decodedText);
            const alertBox = document.getElementById('result-alert');

            // Feedback visual cepat saat QR terbaca
            alertBox.innerHTML = `
                <div class="bg-blue-950 border border-blue-500 text-blue-200 p-4 rounded-lg text-center font-semibold animate-pulse">
                    ⏳ Memeriksa ID: <span class="text-white font-mono">${cleanTicketCode}</span>...
                </div>
            `;

            try {
                const data = await fetchWithFallback(cleanTicketCode);

                if (data.status === 'success') {
                    alertBox.innerHTML = `
                        <div class="bg-emerald-950 border border-emerald-500 text-emerald-200 p-4 rounded-lg text-center">
                            <p class="font-bold text-lg text-emerald-400">✅ MASUK / VALID</p>
                            <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                            <p class="text-xs text-emerald-300 mt-1">Pemegang: <strong>${data.holder || '-'}</strong></p>
                        </div>
                    `;
                } else if (data.status === 'already_used' || data.status === 'already_checked') {
                    alertBox.innerHTML = `
                        <div class="bg-amber-950 border border-amber-500 text-amber-200 p-4 rounded-lg text-center">
                            <p class="font-bold text-lg text-amber-400">⚠️ SUDAH DIPAKAI!</p>
                            <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                            <p class="text-xs text-amber-300 mt-1">${data.message || 'Tiket ini sudah di-scan sebelumnya.'}</p>
                        </div>
                    `;
                } else {
                    alertBox.innerHTML = `
                        <div class="bg-rose-950 border border-rose-500 text-rose-200 p-4 rounded-lg text-center">
                            <p class="font-bold text-lg text-rose-400">❌ TIKET PALSU / TIDAK VALID</p>
                            <p class="text-sm mt-1 text-white font-mono">${cleanTicketCode}</p>
                            <p class="text-xs text-rose-300 mt-1">${data.message || 'Tiket tidak ditemukan di sistem.'}</p>
                        </div>
                    `;
                }
            } catch (err) {
                alertBox.innerHTML = `
                    <div class="bg-rose-950 border border-rose-500 text-rose-200 p-4 rounded-lg text-center font-semibold text-xs">
                        ⚠️ Gangguan Jaringan / Server Backend. Coba lagi.
                    </div>
                `;
            } finally {
                // Beri jeda 1.5 detik agar status bisa dibaca panitia, lalu langsung siap scan penonton berikutnya
                setTimeout(() => {
                    alertBox.innerHTML = `
                        <div class="bg-slate-900 border border-slate-700 text-slate-400 p-4 rounded-lg text-center text-sm">
                            Arahkan kamera ke QR Code Tiket berikutnya...
                        </div>
                    `;
                    isProcessing = false; // Buka kunci scan
                }, 1500);
            }
        }

        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            // FPS dinaikkan ke 20 agar pembacaan sangat cepat & responsif
            const config = { 
                fps: 20, 
                qrbox: (viewfinderWidth, viewfinderHeight) => {
                    const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
                    const qrboxSize = Math.floor(minEdge * 0.7);
                    return { width: qrboxSize, height: qrboxSize };
                }
            };
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                config, 
                onScanSuccess
            ).catch(err => {
                console.warn("Kamera belakang gagal, mencoba kamera default...", err);
                html5QrCode.start(
                    { facingMode: "user" }, 
                    config, 
                    onScanSuccess
                ).catch(fallbackErr => {
                    console.error("Gagal mengakses kamera:", fallbackErr);
                    document.getElementById('result-alert').innerHTML = `
                        <div class="bg-rose-950 border border-rose-500 text-rose-200 p-3 rounded-lg text-center text-xs">
                            ⚠️ Tidak dapat mengakses kamera. Pastikan izin kamera pada browser sudah diaktifkan (Allow) dan gunakan HTTPS.
                        </div>
                    `;
                });
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            startScanner();
        });
    </script>
</body>
</html>
